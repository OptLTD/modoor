[project]
name = "modoor"
version = "0.1.0"
description = "AI capability layer: Module → Skill + MCP (Phase 0)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
modoor-mcp = "modoor.runtime.mcp_server:main"
modoor-web = "modoor.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modoor", "modules", "external"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
