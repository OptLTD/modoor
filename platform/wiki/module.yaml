id: wiki
version: 0.2.0
depends: []
summary: Wiki projects with hierarchical pages and block editor
tags: [content, docs, knowledge]

ui-web:
  kind: app
  label: Wiki
  base: /wiki
  entry: /wiki

exports:
  tools:
    - wiki.create_project
    - wiki.list_projects
    - wiki.create_page
    - wiki.update_page
    - wiki.get_page
    - wiki.list_pages
    - wiki.delete_page
  skills:
    - wiki.manage_page
  menus:
    - id: wiki.home
      label: Projects
      path: /wiki
      sequence: 10

ability:
  - wiki.project.read
  - wiki.project.write
  - wiki.page.read
  - wiki.page.write
  - wiki.page.delete

risk_default: medium

i18n:
  zh-CN:
    app.label: 知识库
    wiki.home: 项目
    wiki.project.read: 读取项目
    wiki.project.write: 管理项目
    wiki.page.read: 读取页面
    wiki.page.write: 管理页面
    wiki.page.delete: 删除页面
  en-US:
    app.label: Wiki
    wiki.home: Projects
